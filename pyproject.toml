[project]
name = "jarvis-jr"
version = "0.1.0"
description = "First-person AI assistant (formerly 'lookout')"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.40.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "pynput>=1.7.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dateutil>=2.9.0",
    "tzlocal>=5.2",
    "google-genai>=2.5.0",
    "openai>=2.37.0",
    "ddgs>=9.0.0",
    "trafilatura>=2.0.0",
    "mcp>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "ipython>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_jr"]

[tool.ruff]
line-length = 100
target-version = "py312"
