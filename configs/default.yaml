audio:
  sample_rate: 16000
  channels: 1
  input_device: null
  output_device: null

camera:
  name_contains: "iPhone"
  width: 640          # keep small — vision prefill on local models is the latency killer
  height: 360
  jpeg_quality: 80
  # When to attach the camera frame to the LLM request:
  #   "auto"   — only when the question sounds visual ("what is this", "read that sign")
  #   "always" — every turn (old behavior)
  #   "never"  — text-only
  attach_policy: "auto"

stt:
  model: "base.en"
  compute_type: "int8"
  vad_filter: true

tts:
  voice: "en_US-amy-medium"
  speed: 1.0

llm:
  # Active provider + model. Switch by editing these two lines.
  provider: "ollama"                     # "anthropic" | "google" | "ollama"
  model: "google/gemma-4-26b-a4b-qat"    # provider-specific ID
  max_tokens: 2048   # headroom for thinking models (e.g. gemma4) whose reasoning counts against the cap
  system_prompt_path: null

  # Reference defaults for each provider — copy into the active fields above
  # when switching.
  anthropic:
    model: "claude-sonnet-4-6"
  google:
    model: "gemini-2.5-flash"
  ollama:
    # Works with any OpenAI-compatible local server (Ollama, LM Studio).
    # Ollama:    model "gemma4:12b", base_url http://localhost:11434 (needs recent Ollama)
    # LM Studio: model "google/gemma-4-12b" (match the ID shown in LM Studio),
    #            base_url http://localhost:1234, server started in the Developer tab
    model: "google/gemma-4-26b-a4b-qat"   # MoE: 26B total / ~4B active — faster than dense 12b, better quality
    base_url: "http://192.168.1.179:1234"

# Tool profiles: which tools the LLM sees. Small local models get confused
# past ~15 tools, so keep the everyday voice set lean. Patterns use fnmatch
# ("edgar_*" = all EDGAR tools, "*" = everything). Switch per run with
# `run_jarvis.py --profile desk`.
tools:
  profile: "voice"
  profiles:
    voice:
      - "set_timer"
      - "create_event"
      - "list_events"
      - "web_search"
      - "web_news"
      - "fetch_page"
      - "remember"
      - "recall"
      - "open_app"
      - "control_music"
      - "set_volume"
    desk:
      - "*"

# MCP (Model Context Protocol) servers. Each server's tools are auto-discovered
# and exposed to the LLM as "<name>_<tool>". Most published servers run via
# npx (Node) or uvx (Python) — they're downloaded on first launch.
# Add write-capable tools to confirmation.require_for below!
mcp:
  call_timeout_s: 30.0
  servers:
    # SEC EDGAR filings: company lookup, 10-K/10-Q/8-K retrieval + section
    # extraction, XBRL financials, insider trading. Tools appear as edgar_*.
    # NOTE: filing sections are long — load a 32K+ context preset in LM Studio
    # for filing analysis sessions.
    - name: "edgar"
      command: "uvx"
      args: ["sec-edgar-mcp"]
      env:
        SEC_EDGAR_USER_AGENT: "Marcelo Castellanos (castellanosmarcelo1@gmail.com)"
  # More examples:
  #   - name: "files"
  #     command: "npx"
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/Users/marcelocastellanos/JarvisSandbox"]

confirmation:
  require_for: ["create_event", "delete_event", "update_event", "forget"]
  yes_words: ["yes", "yeah", "yep", "yup", "do it", "go ahead", "confirm"]
  no_words: ["no", "nope", "cancel", "stop", "wait", "don't"]

calendar:
  default_calendar_id: "primary"
  default_duration_minutes: 30
  default_timezone: null
